<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zombotanic map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }
        #toolbar {
            background: #111111;
            padding: 10px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #222222;
            flex-shrink: 0;
            z-index: 10;
        }
        #toolbar h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-right: 12px;
            white-space: nowrap;
        }
        #toolbar .btn {
            background: transparent;
            border: 1px solid #333333;
            color: #c0c0c0;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 450;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            min-height: 34px;
            min-width: 34px;
        }
        #toolbar .btn:hover {
            background: #222222;
            border-color: #555555;
            color: #ffffff;
        }
        #toolbar .btn:active {
            transform: scale(0.95);
        }
        #toolbar .btn-primary {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        #toolbar .btn-primary:hover {
            background: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
        }
        #toolbar .btn-success {
            border-color: #8b5cf6;
            color: #8b5cf6;
        }
        #toolbar .btn-success:hover {
            background: #8b5cf6;
            color: #ffffff;
            border-color: #8b5cf6;
        }
        #toolbar .btn-info {
            border-color: #06b6d4;
            color: #06b6d4;
        }
        #toolbar .btn-info:hover {
            background: #06b6d4;
            color: #ffffff;
            border-color: #06b6d4;
        }
        #toolbar .btn-warning {
            border-color: #f59e0b;
            color: #f59e0b;
        }
        #toolbar .btn-warning:hover {
            background: #f59e0b;
            color: #ffffff;
            border-color: #f59e0b;
        }
        #toolbar .sep {
            width: 1px;
            height: 28px;
            background: #2a2a2a;
            margin: 0 4px;
            flex-shrink: 0;
        }
        #toolbar .info-badge {
            background: #181818;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #999999;
            border: 1px solid #282828;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        #toolbar .info-badge strong {
            color: #ffffff;
            font-weight: 500;
        }
        #layer-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #1a1a1a;
            padding: 2px 10px 2px 6px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            cursor: pointer;
            font-size: 12px;
            color: #aaaaaa;
            transition: all 0.2s ease;
        }
        .layer-toggle:hover {
            border-color: #444444;
            background: #222222;
        }
        .layer-toggle .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .layer-toggle .dot.on {
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.3);
        }
        .layer-toggle .dot.off {
            background: #555555;
        }
        .layer-toggle .label {
            font-weight: 450;
        }
        #map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
            cursor: grab;
        }
        #map-container:active {
            cursor: grabbing;
        }
        #map-container canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #mapCanvas {
            z-index: 1;
        }
        .file-input-wrap {
            position: relative;
            display: inline-block;
        }
        .file-input-wrap input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            flex-shrink: 0;
        }
        .icon-sm {
            width: 14px;
            height: 14px;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 16px;
            padding: 32px 40px;
            max-width: 520px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal h2 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal .subtitle {
            color: #888888;
            font-size: 14px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 16px;
        }
        .modal .section {
            margin-bottom: 20px;
        }
        .modal .section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #06b6d4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .modal .shortcut {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #222222;
            font-size: 14px;
        }
        .modal .shortcut:last-child {
            border-bottom: none;
        }
        .modal .shortcut .key {
            background: #2a2a2a;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #cccccc;
            border: 1px solid #3a3a3a;
            font-family: monospace;
        }
        .modal .shortcut .action {
            color: #aaaaaa;
        }
        .modal .close-btn {
            background: #2a2a2a;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 8px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
            transition: all 0.2s ease;
            width: 100%;
        }
        .modal .close-btn:hover {
            background: #333333;
            border-color: #555555;
        }
        .modal .version {
            color: #555555;
            font-size: 12px;
            text-align: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #222222;
        }

        @media (max-width: 820px) {
            #toolbar {
                padding: 8px 14px;
                gap: 6px;
            }
            #toolbar h1 {
                font-size: 15px;
                margin-right: 6px;
            }
            #toolbar .btn {
                font-size: 12px;
                padding: 4px 10px;
                min-height: 30px;
                min-width: 30px;
            }
            #toolbar .info-badge {
                font-size: 11px;
                padding: 2px 10px;
            }
            .icon {
                width: 16px;
                height: 16px;
            }
            .icon-sm {
                width: 12px;
                height: 12px;
            }
            .modal {
                padding: 24px 20px;
            }
            .modal h2 {
                font-size: 18px;
            }
        }
        @media (max-width: 600px) {
            #toolbar {
                flex-wrap: wrap;
                justify-content: center;
            }
            #toolbar h1 {
                width: 100%;
                text-align: center;
                margin-right: 0;
            }
            #layer-controls {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <h1>zombotanic map</h1>
        <div class="file-input-wrap" id="manualTmxWrap" style="display:none;">
            <button class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                </svg>
                TMX
            </button>
            <input type="file" id="tmxFileInput" accept=".tmx,.xml" />
        </div>
        <div class="file-input-wrap" id="manualImgWrap" style="display:none;">
            <button class="btn btn-success">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <polyline points="21 15 16 10 5 21" />
                </svg>
                Images
            </button>
            <input type="file" id="imageFileInput" accept="image/*" multiple />
        </div>
        <span class="sep" id="manualSep" style="display:none;"></span>

        <div id="layer-controls">
            <span class="info-badge" style="border-color:#333; background:#161616; gap:4px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="2" />
                    <line x1="8" y1="2" x2="8" y2="22" />
                    <line x1="16" y1="2" x2="16" y2="22" />
                    <line x1="2" y1="8" x2="22" y2="8" />
                    <line x1="2" y1="16" x2="22" y2="16" />
                </svg>
                <span id="layerCount">0</span>
            </span>
        </div>

        <span class="sep"></span>
        <span class="info-badge" id="mapInfo">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
            </svg>
            <strong>—</strong>
        </span>
        <span class="info-badge" id="tileInfo">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
            </svg>
            <strong>—</strong>
        </span>
        <button class="btn" id="zoomInBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        </button>
        <button class="btn" id="zoomOutBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        </button>
        <button class="btn" id="resetViewBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="8 8 3 13 8 18" />
                <path d="M21 13H3" />
            </svg>
        </button>
        <button class="btn btn-info" id="helpBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
        </button>
    </div>
    <div id="map-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <div class="modal-overlay" id="helpModal">
        <div class="modal">
            <h2>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
                управление картой
            </h2>
            <div class="subtitle">zombotanic map — просмотрщик карты из игры zombotanic</div>

            <div class="section">
                <h3>мышь</h3>
                <div class="shortcut">
                    <span class="action">перетаскивание</span>
                    <span class="key">зажать ЛКМ + двигать</span>
                </div>
                <div class="shortcut">
                    <span class="action">приблизить / отдалить</span>
                    <span class="key">колёсико мыши</span>
                </div>
            </div>

            <div class="section">
                <h3>клавиатура</h3>
                <div class="shortcut">
                    <span class="action">cбросить вид</span>
                    <span class="key">ctrl + 0</span>
                </div>
                <div class="shortcut">
                    <span class="action">приблизить</span>
                    <span class="key">ctrl + +</span>
                </div>
                <div class="shortcut">
                    <span class="action">отдалить</span>
                    <span class="key">ctrl + -</span>
                </div>
            </div>
            <button class="close-btn" id="closeHelpBtn">✕ Закрыть</button>
            <div class="version">при сильном отдалении могут быть проблемы</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('map-container');
        const mapInfoEl = document.getElementById('mapInfo');
        const tileInfoEl = document.getElementById('tileInfo');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const helpBtn = document.getElementById('helpBtn');
        const helpModal = document.getElementById('helpModal');
        const closeHelpBtn = document.getElementById('closeHelpBtn');
        const manualTmxWrap = document.getElementById('manualTmxWrap');
        const manualImgWrap = document.getElementById('manualImgWrap');
        const manualSep = document.getElementById('manualSep');
        const tmxFileInput = document.getElementById('tmxFileInput');
        const imageFileInput = document.getElementById('imageFileInput');
        const layerControls = document.getElementById('layer-controls');
        const layerCountEl = document.getElementById('layerCount');

        helpBtn.addEventListener('click', () => {
            helpModal.classList.add('active');
        });

        closeHelpBtn.addEventListener('click', () => {
            helpModal.classList.remove('active');
        });

        helpModal.addEventListener('click', (e) => {
            if (e.target === helpModal) {
                helpModal.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && helpModal.classList.contains('active')) {
                helpModal.classList.remove('active');
            }
            if (e.key === '?' && !helpModal.classList.contains('active')) {
                e.preventDefault();
                helpModal.classList.add('active');
            }
        });

        let mapData = null;
        let tilesetImages = {};
        let tilesetsLoaded = false;
        let zoom = 1;
        let offsetX = 0;
        let offsetY = 0;
        let dpr = window.devicePixelRatio || 1;

        let allTileData = [];
        let mapWidth = 0;
        let mapHeight = 0;
        let tileWidth = 0;
        let tileHeight = 0;
        let mapTotalWidth = 0;
        let mapTotalHeight = 0;

        let renderRequested = false;
        let chunkCache = {};
        let chunkSize = 16;

        // Список слоёв с их видимостью
        let layers = [];
        let layerVisibility = {};

        function updateLayerControls() {
            const existing = layerControls.querySelectorAll('.layer-toggle:not(.info-badge)');
            existing.forEach(el => el.remove());

            if (layers.length === 0) {
                layerCountEl.textContent = '0';
                return;
            }

            layerCountEl.textContent = layers.length;

            // Создаём переключатели для каждого слоя (в обратном порядке, чтобы сверху были верхние слои)
            const reversed = [...layers].reverse();
            for (const layer of reversed) {
                const name = layer.name || 'layer';
                const isVisible = layerVisibility[layer.name] !== false;
                const toggle = document.createElement('div');
                toggle.className = 'layer-toggle';
                toggle.dataset.layer = layer.name;

                const dot = document.createElement('span');
                dot.className = `dot ${isVisible ? 'on' : 'off'}`;
                toggle.appendChild(dot);

                const label = document.createElement('span');
                label.className = 'label';
                label.textContent = name.length > 12 ? name.slice(0, 10) + '…' : name;
                toggle.appendChild(label);

                toggle.addEventListener('click', () => {
                    layerVisibility[layer.name] = !layerVisibility[layer.name];
                    chunkCache = {};
                    renderMap();
                    updateLayerControls();
                });

                layerControls.appendChild(toggle);
            }
        }

        function updateInfo() {
            if (!mapData) {
                mapInfoEl.innerHTML = '<strong>—</strong>';
                tileInfoEl.innerHTML = '<strong>—</strong>';
                return;
            }
            mapInfoEl.innerHTML = `<strong>${mapData.width}×${mapData.height}</strong> (${mapData.tilewidth}×${mapData.tileheight}px)`;
            tileInfoEl.innerHTML = `<strong>${(mapData.width * mapData.height).toLocaleString()}</strong>`;
        }

        async function fetchTilesetDefinition(url) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const xmlText = await resp.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, 'application/xml');
                const tilesetEl = doc.querySelector('tileset');
                if (!tilesetEl) throw new Error('No <tileset> in .tsx');
                const imageEl = tilesetEl.querySelector('image');
                if (!imageEl) throw new Error('No <image> in .tsx');
                const source = imageEl.getAttribute('source');
                const tilewidth = parseInt(tilesetEl.getAttribute('tilewidth')) || 32;
                const tileheight = parseInt(tilesetEl.getAttribute('tileheight')) || 32;
                const columns = parseInt(tilesetEl.getAttribute('columns')) || 0;
                const tilecount = parseInt(tilesetEl.getAttribute('tilecount')) || 0;
                return { imageSource: source, tilewidth, tileheight, columns, tilecount };
            } catch (e) {
                console.error('Error loading .tsx:', url, e.message);
                return null;
            }
        }

        async function parseTMX(xmlText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(xmlText, 'application/xml');
            const parseError = doc.querySelector('parsererror');
            if (parseError) throw new Error('XML parse error: ' + parseError.textContent);
            const mapEl = doc.querySelector('map');
            if (!mapEl) throw new Error('No <map> element');

            const map = {
                version: mapEl.getAttribute('version') || '1.0',
                orientation: mapEl.getAttribute('orientation') || 'orthogonal',
                width: parseInt(mapEl.getAttribute('width')) || 0,
                height: parseInt(mapEl.getAttribute('height')) || 0,
                tilewidth: parseInt(mapEl.getAttribute('tilewidth')) || 32,
                tileheight: parseInt(mapEl.getAttribute('tileheight')) || 32,
                tilesets: [],
                layers: [],
            };

            const tilesetEls = doc.querySelectorAll('tileset');
            for (const tsEl of tilesetEls) {
                const gid = parseInt(tsEl.getAttribute('firstgid')) || 1;
                const sourceAttr = tsEl.getAttribute('source');

                let tilesetDef = {
                    firstgid: gid,
                    source: sourceAttr,
                    name: tsEl.getAttribute('name') || 'tileset',
                    tilewidth: map.tilewidth,
                    tileheight: map.tileheight,
                    columns: 0,
                    tilecount: 0,
                    imageSource: null,
                };

                if (sourceAttr) {
                    const def = await fetchTilesetDefinition(sourceAttr);
                    if (def) {
                        tilesetDef.tilewidth = def.tilewidth;
                        tilesetDef.tileheight = def.tileheight;
                        tilesetDef.columns = def.columns;
                        tilesetDef.tilecount = def.tilecount;
                        tilesetDef.imageSource = def.imageSource;
                    } else {
                        console.warn('Failed to load .tsx:', sourceAttr);
                    }
                } else {
                    const imageEl = tsEl.querySelector('image');
                    if (imageEl) {
                        tilesetDef.imageSource = imageEl.getAttribute('source');
                        tilesetDef.tilewidth = parseInt(tsEl.getAttribute('tilewidth')) || map.tilewidth;
                        tilesetDef.tileheight = parseInt(tsEl.getAttribute('tileheight')) || map.tileheight;
                        tilesetDef.columns = parseInt(tsEl.getAttribute('columns')) || 0;
                        tilesetDef.tilecount = parseInt(tsEl.getAttribute('tilecount')) || 0;
                    }
                }
                map.tilesets.push(tilesetDef);
            }

            const layerEls = doc.querySelectorAll('layer');
            for (const layerEl of layerEls) {
                const name = layerEl.getAttribute('name') || 'layer';
                const width = parseInt(layerEl.getAttribute('width')) || map.width;
                const height = parseInt(layerEl.getAttribute('height')) || map.height;
                const opacity = parseFloat(layerEl.getAttribute('opacity')) || 1;
                const dataEl = layerEl.querySelector('data');
                let encoding = dataEl ? dataEl.getAttribute('encoding') || 'xml' : 'xml';
                let compression = dataEl ? dataEl.getAttribute('compression') : null;
                let tileData = [];
                if (dataEl) {
                    if (encoding === 'csv') {
                        const csv = dataEl.textContent.trim();
                        tileData = csv.split(/\s*,\s*/).map(Number);
                    } else if (encoding === 'base64') {
                        const base64 = dataEl.textContent.trim();
                        try {
                            const binary = atob(base64);
                            const bytes = new Uint8Array(binary.length);
                            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                            let decompressed;
                            if (compression === 'zlib') decompressed = pako.inflate(bytes);
                            else if (compression === 'gzip') decompressed = pako.ungzip(bytes);
                            else decompressed = bytes;
                            const view = new DataView(decompressed.buffer);
                            const len = decompressed.length / 4;
                            for (let i = 0; i < len; i++) tileData.push(view.getInt32(i * 4, true));
                        } catch (e) { console.error('Base64 decode error:', e);
                            tileData = []; }
                    } else {
                        const tileEls = dataEl.querySelectorAll('tile');
                        for (const tEl of tileEls) tileData.push(parseInt(tEl.getAttribute('gid')) || 0);
                    }
                }
                while (tileData.length < width * height) tileData.push(0);
                map.layers.push({ name, width, height, opacity, encoding, compression, data: tileData.slice(0, width *
                        height) });
            }
            if (map.layers.length === 0) {
                map.layers.push({ name: 'default', width: map.width, height: map.height, opacity: 1, data: new Array(map
                        .width * map.height).fill(0) });
            }
            return map;
        }

        function loadTilesetImages(map) {
            return new Promise((resolve) => {
                const images = {};
                const tilesets = map.tilesets.filter(ts => ts.imageSource);
                if (tilesets.length === 0) {
                    resolve(images);
                    return;
                }
                let loaded = 0;
                const total = tilesets.length;
                tilesets.forEach((ts) => {
                    const src = ts.imageSource;
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        images[ts.firstgid] = img;
                        loaded++;
                        if (loaded === total) resolve(images);
                    };
                    img.onerror = () => {
                        console.warn('Failed to load image:', src);
                        loaded++;
                        if (loaded === total) resolve(images);
                    };
                    img.src = src;
                });
            });
        }

        // Кэш для тайлов
        let tileCache = {};

        function getTileImage(gid) {
            if (gid === 0) return null;
            let ts = null;
            let localId = gid;
            for (const t of mapData.tilesets) {
                if (gid >= t.firstgid) {
                    ts = t;
                    localId = gid - t.firstgid;
                } else break;
            }
            if (!ts) return null;
            const img = tilesetImages[ts.firstgid];
            if (!img) return null;

            const cols = ts.columns || Math.floor(img.width / ts.tilewidth);
            const tileIndex = localId;
            const sx = (tileIndex % cols) * ts.tilewidth;
            const sy = Math.floor(tileIndex / cols) * ts.tileheight;

            const key = ts.firstgid + '_' + localId;
            if (!tileCache[key]) {
                const c = document.createElement('canvas');
                c.width = ts.tilewidth;
                c.height = ts.tileheight;
                const cctx = c.getContext('2d');
                cctx.drawImage(img, sx, sy, ts.tilewidth, ts.tileheight, 0, 0, ts.tilewidth, ts.tileheight);
                tileCache[key] = c;
            }
            return tileCache[key];
        }

        // Сборка чанка из всех видимых слоёв
        function buildChunk(chunkRow, chunkCol) {
            const key = chunkRow + '_' + chunkCol;
            if (chunkCache[key]) return chunkCache[key];

            const tw = tileWidth;
            const th = tileHeight;
            const startRow = chunkRow * chunkSize;
            const startCol = chunkCol * chunkSize;
            const endRow = Math.min(startRow + chunkSize, mapHeight);
            const endCol = Math.min(startCol + chunkSize, mapWidth);

            const cw = (endCol - startCol) * tw;
            const ch = (endRow - startRow) * th;

            // Создаём временный canvas для чанка
            const c = document.createElement('canvas');
            c.width = cw;
            c.height = ch;
            const cctx = c.getContext('2d');
            cctx.imageSmoothingEnabled = false;

            let hasContent = false;

            // Рисуем все видимые слои
            for (const layer of layers) {
                if (layerVisibility[layer.name] === false) continue;
                const data = layer.data;
                if (!data) continue;

                for (let r = startRow; r < endRow; r++) {
                    for (let col = startCol; col < endCol; col++) {
                        const idx = r * mapWidth + col;
                        const gid = data[idx] || 0;
                        if (gid === 0) continue;
                        const img = getTileImage(gid);
                        if (!img) continue;
                        hasContent = true;
                        const dx = (col - startCol) * tw;
                        const dy = (r - startRow) * th;
                        cctx.drawImage(img, 0, 0, tw, th, dx, dy, tw, th);
                    }
                }
            }

            if (!hasContent) {
                chunkCache[key] = null;
                return null;
            }

            chunkCache[key] = c;
            return c;
        }

        function getChunk(chunkRow, chunkCol) {
            return buildChunk(chunkRow, chunkCol);
        }

        function setupMap() {
            if (!mapData || !tilesetsLoaded) {
                console.log('Cannot setup map: missing data');
                return;
            }

            // Сохраняем все слои
            layers = mapData.layers;
            // Инициализируем видимость всех слоёв (все видны по умолчанию)
            layerVisibility = {};
            for (const layer of layers) {
                layerVisibility[layer.name] = true;
            }

            // Используем данные первого слоя для размера (все слои одного размера)
            const firstLayer = layers[0];
            tileData = firstLayer.data;
            mapWidth = mapData.width;
            mapHeight = mapData.height;
            tileWidth = mapData.tilewidth;
            tileHeight = mapData.tileheight;
            mapTotalWidth = mapWidth * tileWidth;
            mapTotalHeight = mapHeight * tileHeight;

            chunkSize = Math.max(4, Math.floor(64 / Math.max(tileWidth, tileHeight) * 4));
            chunkSize = Math.min(32, chunkSize);

            tileCache = {};
            chunkCache = {};

            zoom = 1;
            offsetX = 0;
            offsetY = 0;

            updateLayerControls();
            console.log('Map setup complete:', mapWidth, 'x', mapHeight, 'layers:', layers.length, 'chunk size:',
            chunkSize);
            renderMap();
        }

        function renderMap() {
            if (renderRequested) return;
            renderRequested = true;
            requestAnimationFrame(() => {
                renderRequested = false;
                renderMapNow();
            });
        }

        function renderMapNow() {
            const rect = container.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;

            if (w === 0 || h === 0) return;

            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);

            if (!layers.length || !tilesetsLoaded) {
                return;
            }

            ctx.imageSmoothingEnabled = false;

            const startCol = Math.floor(offsetX / (tileWidth * zoom));
            const endCol = Math.ceil((offsetX + w) / (tileWidth * zoom));
            const startRow = Math.floor(offsetY / (tileHeight * zoom));
            const endRow = Math.ceil((offsetY + h) / (tileHeight * zoom));

            const col0 = Math.max(0, startCol);
            const col1 = Math.min(mapWidth - 1, endCol);
            const row0 = Math.max(0, startRow);
            const row1 = Math.min(mapHeight - 1, endRow);

            if (col0 > col1 || row0 > row1) return;

            const chunkCol0 = Math.floor(col0 / chunkSize);
            const chunkCol1 = Math.floor(col1 / chunkSize);
            const chunkRow0 = Math.floor(row0 / chunkSize);
            const chunkRow1 = Math.floor(row1 / chunkSize);

            for (let cr = chunkRow0; cr <= chunkRow1; cr++) {
                for (let cc = chunkCol0; cc <= chunkCol1; cc++) {
                    const chunk = getChunk(cr, cc);
                    if (!chunk) continue;

                    const startR = cr * chunkSize;
                    const startC = cc * chunkSize;
                    const endR = Math.min(startR + chunkSize, mapHeight);
                    const endC = Math.min(startC + chunkSize, mapWidth);
                    const cw = (endC - startC) * tileWidth;
                    const ch = (endR - startR) * tileHeight;

                    const dx = startC * tileWidth * zoom - offsetX;
                    const dy = startR * tileHeight * zoom - offsetY;
                    const dw = cw * zoom;
                    const dh = ch * zoom;

                    ctx.drawImage(chunk, 0, 0, cw, ch, dx, dy, dw, dh);
                }
            }
        }

        function setupInteraction() {
            let isDragging = false,
                startX = 0,
                startY = 0,
                startOffX = 0,
                startOffY = 0;

            container.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startOffX = offsetX;
                startOffY = offsetY;
                container.style.cursor = 'grabbing';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const dx = (e.clientX - startX) / zoom;
                    const dy = (e.clientY - startY) / zoom;
                    offsetX = startOffX - dx;
                    offsetY = startOffY - dy;
                    renderMap();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    container.style.cursor = 'grab';
                }
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (!layers.length || !tilesetsLoaded) return;

                const rect = container.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;

                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                const newZoom = Math.min(64, Math.max(0.02, zoom + delta * zoom));

                if (newZoom === zoom) return;

                const mapX = (mx + offsetX) / zoom;
                const mapY = (my + offsetY) / zoom;

                zoom = newZoom;

                offsetX = mapX * zoom - mx;
                offsetY = mapY * zoom - my;

                renderMap();
            }, { passive: false });

            resetViewBtn.addEventListener('click', () => {
                zoom = 1;
                offsetX = 0;
                offsetY = 0;
                renderMap();
            });

            zoomInBtn.addEventListener('click', () => {
                const rect = container.getBoundingClientRect();
                const mx = rect.width / 2;
                const my = rect.height / 2;

                const newZoom = Math.min(64, zoom * 1.3);
                if (newZoom === zoom) return;

                const mapX = (mx + offsetX) / zoom;
                const mapY = (my + offsetY) / zoom;

                zoom = newZoom;

                offsetX = mapX * zoom - mx;
                offsetY = mapY * zoom - my;

                renderMap();
            });

            zoomOutBtn.addEventListener('click', () => {
                const rect = container.getBoundingClientRect();
                const mx = rect.width / 2;
                const my = rect.height / 2;

                const newZoom = Math.max(0.02, zoom / 1.3);
                if (newZoom === zoom) return;

                const mapX = (mx + offsetX) / zoom;
                const mapY = (my + offsetY) / zoom;

                zoom = newZoom;

                offsetX = mapX * zoom - mx;
                offsetY = mapY * zoom - my;

                renderMap();
            });

            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === '0') {
                    e.preventDefault();
                    zoom = 1;
                    offsetX = 0;
                    offsetY = 0;
                    renderMap();
                }
                if (e.ctrlKey && (e.key === '=' || e.key === '+')) {
                    e.preventDefault();
                    const rect = container.getBoundingClientRect();
                    const mx = rect.width / 2;
                    const my = rect.height / 2;
                    const newZoom = Math.min(64, zoom * 1.3);
                    if (newZoom === zoom) return;
                    const mapX = (mx + offsetX) / zoom;
                    const mapY = (my + offsetY) / zoom;
                    zoom = newZoom;
                    offsetX = mapX * zoom - mx;
                    offsetY = mapY * zoom - my;
                    renderMap();
                }
                if (e.ctrlKey && e.key === '-') {
                    e.preventDefault();
                    const rect = container.getBoundingClientRect();
                    const mx = rect.width / 2;
                    const my = rect.height / 2;
                    const newZoom = Math.max(0.02, zoom / 1.3);
                    if (newZoom === zoom) return;
                    const mapX = (mx + offsetX) / zoom;
                    const mapY = (my + offsetY) / zoom;
                    zoom = newZoom;
                    offsetX = mapX * zoom - mx;
                    offsetY = mapY * zoom - my;
                    renderMap();
                }
            });
        }

        async function loadMapFromURL() {
            try {
                console.log('Loading map.tmx...');
                const response = await fetch('map.tmx');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const xmlText = await response.text();
                mapData = await parseTMX(xmlText);
                updateInfo();

                const images = await loadTilesetImages(mapData);
                tilesetImages = images;
                tilesetsLoaded = true;

                setupMap();
                return true;
            } catch (err) {
                console.warn('Auto-load failed:', err.message);
                return false;
            }
        }

        async function loadMapFromFile(tmxFile, imageFiles) {
            try {
                const text = await tmxFile.text();
                mapData = await parseTMX(text);
                updateInfo();

                const images = {};
                const total = mapData.tilesets.length;
                let loaded = 0;

                if (total === 0) {
                    tilesetImages = images;
                    tilesetsLoaded = true;
                    setupMap();
                    return;
                }

                for (const ts of mapData.tilesets) {
                    if (!ts.imageSource) {
                        loaded++;
                        if (loaded === total) finish();
                        continue;
                    }
                    const filename = ts.imageSource.split(/[\\/]/).pop();
                    let found = false;
                    for (const file of imageFiles) {
                        if (file.name === filename) {
                            const img = new Image();
                            img.onload = () => {
                                images[ts.firstgid] = img;
                                loaded++;
                                if (loaded === total) finish();
                            };
                            img.onerror = () => {
                                console.warn('Failed to load:', file.name);
                                loaded++;
                                if (loaded === total) finish();
                            };
                            img.src = URL.createObjectURL(file);
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        console.warn('File not found:', filename);
                        loaded++;
                        if (loaded === total) finish();
                    }
                }

                function finish() {
                    tilesetImages = images;
                    tilesetsLoaded = true;
                    setupMap();
                }
            } catch (err) {
                console.error(err);
            }
        }

        tmxFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            mapData = null;
            tilesetImages = {};
            tilesetsLoaded = false;
            tileData = null;
            tileCache = {};
            chunkCache = {};
            layers = [];

            const imageFiles = imageFileInput.files;
            if (imageFiles.length === 0) {
                alert('Please select tileset images first (Images button).');
                return;
            }
            loadMapFromFile(file, imageFiles);
        });

        imageFileInput.addEventListener('change', () => {
            if (mapData && !tilesetsLoaded) {
                const tmxFiles = tmxFileInput.files;
                if (tmxFiles.length > 0) loadMapFromFile(tmxFiles[0], imageFileInput.files);
            }
        });

        window.addEventListener('resize', () => {
            renderMap();
        });

        async function init() {
            setupInteraction();
            const autoOk = await loadMapFromURL();
            if (!autoOk) {
                manualTmxWrap.style.display = 'inline-block';
                manualImgWrap.style.display = 'inline-block';
                manualSep.style.display = 'inline-block';
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
