<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zombotanic map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/heroicons@2.1.1/css/heroicons.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }
        #toolbar {
            background: #111111;
            padding: 10px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #222222;
            flex-shrink: 0;
            z-index: 10;
            animation: fadeDown 0.4s ease-out;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #toolbar h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #ffffff;
            margin-right: 12px;
            white-space: nowrap;
        }
        #toolbar .btn {
            background: transparent;
            border: 1px solid #333333;
            color: #c0c0c0;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 450;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            min-height: 34px;
            min-width: 34px;
        }
        #toolbar .btn:hover {
            background: #222222;
            border-color: #555555;
            color: #ffffff;
            transform: scale(1.02);
        }
        #toolbar .btn:active { transform: scale(0.95); }
        #toolbar .btn-primary {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        #toolbar .btn-primary:hover {
            background: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
        }
        #toolbar .btn-success {
            border-color: #8b5cf6;
            color: #8b5cf6;
        }
        #toolbar .btn-success:hover {
            background: #8b5cf6;
            color: #ffffff;
            border-color: #8b5cf6;
        }
        #toolbar .sep {
            width: 1px;
            height: 28px;
            background: #2a2a2a;
            margin: 0 4px;
            flex-shrink: 0;
        }
        #toolbar .info-badge {
            background: #181818;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #999999;
            border: 1px solid #282828;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.3s ease;
        }
        #toolbar .info-badge strong {
            color: #ffffff;
            font-weight: 500;
        }
        #map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
            cursor: grab;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #map-container:active { cursor: grabbing; }
        #map-container canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
        }
        #hover-info {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: rgba(17, 17, 17, 0.92);
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            color: #b0b0b0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            border: 1px solid #2a2a2a;
            white-space: nowrap;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
        }
        #hover-info.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #hover-info span {
            color: #ffffff;
            font-weight: 500;
        }
        .file-input-wrap {
            position: relative;
            display: inline-block;
        }
        .file-input-wrap input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        @media (max-width: 820px) {
            #toolbar { padding: 8px 14px; gap: 6px; }
            #toolbar h1 { font-size: 15px; margin-right: 6px; }
            #toolbar .btn { font-size: 12px; padding: 4px 10px; min-height: 30px; min-width: 30px; }
            #toolbar .info-badge { font-size: 11px; padding: 2px 10px; }
            #hover-info { font-size: 12px; padding: 6px 14px; bottom: 18px; }
        }
        @media (max-width: 600px) {
            #toolbar { flex-wrap: wrap; justify-content: center; }
            #toolbar h1 { width: 100%; text-align: center; margin-right: 0; }
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <h1>zombotanic map</h1>

        <div class="file-input-wrap" id="manualTmxWrap" style="display:none;">
            <button class="btn btn-primary">
                <svg class="heroicon heroicon-document" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                </svg>
                TMX
            </button>
            <input type="file" id="tmxFileInput" accept=".tmx,.xml" />
        </div>

        <div class="file-input-wrap" id="manualImgWrap" style="display:none;">
            <button class="btn btn-success">
                <svg class="heroicon heroicon-photo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <polyline points="21 15 16 10 5 21" />
                </svg>
                Images
            </button>
            <input type="file" id="imageFileInput" accept="image/*" multiple />
        </div>

        <span class="sep" id="manualSep" style="display:none;"></span>

        <span class="info-badge" id="mapInfo">
            <svg class="heroicon heroicon-grid" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
            </svg>
            <strong>—</strong>
        </span>

        <span class="info-badge" id="tileInfo">
            <svg class="heroicon heroicon-squares-2x2" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
            </svg>
            <strong>—</strong>
        </span>

        <button class="btn" id="zoomInBtn" title="приблизить">
            <svg class="heroicon heroicon-plus" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        </button>

        <button class="btn" id="zoomOutBtn" title="отдалить">
            <svg class="heroicon heroicon-minus" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        </button>

        <button class="btn" id="resetViewBtn" title="сбросить вид">
            <svg class="heroicon heroicon-arrow-uturn-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="8 8 3 13 8 18" />
                <path d="M21 13H3" />
            </svg>
        </button>
    </div>

    <div id="map-container">
        <canvas id="mapCanvas"></canvas>
        <div id="hover-info">
            Tile <span id="hoverTileId">—</span> &nbsp;·&nbsp; (<span id="hoverPosX">0</span>, <span id="hoverPosY">0</span>)
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('map-container');

        const mapInfoEl = document.getElementById('mapInfo');
        const tileInfoEl = document.getElementById('tileInfo');
        const hoverInfo = document.getElementById('hover-info');
        const hoverTileId = document.getElementById('hoverTileId');
        const hoverPosX = document.getElementById('hoverPosX');
        const hoverPosY = document.getElementById('hoverPosY');

        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');

        const manualTmxWrap = document.getElementById('manualTmxWrap');
        const manualImgWrap = document.getElementById('manualImgWrap');
        const manualSep = document.getElementById('manualSep');
        const tmxFileInput = document.getElementById('tmxFileInput');
        const imageFileInput = document.getElementById('imageFileInput');

        const state = {
            map: null,
            tilesetImages: {},
            zoom: 1,
            offsetX: 0,
            offsetY: 0,
            tilesetsLoaded: false,
            hoverGid: null,
            hoverCol: -1,
            hoverRow: -1,
            cacheCanvas: null,
            cacheScale: 1,
        };

        function updateInfo() {
            if (!state.map) {
                mapInfoEl.innerHTML = '<strong>—</strong>';
                tileInfoEl.innerHTML = '<strong>—</strong>';
                return;
            }
            const m = state.map;
            mapInfoEl.innerHTML = `<strong>${m.width}×${m.height}</strong> (${m.tilewidth}×${m.tileheight}px)`;
            tileInfoEl.innerHTML = `<strong>${(m.width * m.height).toLocaleString()}</strong>`;
        }

        async function fetchTilesetDefinition(url) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const xmlText = await resp.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, 'application/xml');
                const tilesetEl = doc.querySelector('tileset');
                if (!tilesetEl) throw new Error('No <tileset> in .tsx');
                const imageEl = tilesetEl.querySelector('image');
                if (!imageEl) throw new Error('No <image> in .tsx');
                const source = imageEl.getAttribute('source');
                const tilewidth = parseInt(tilesetEl.getAttribute('tilewidth')) || 32;
                const tileheight = parseInt(tilesetEl.getAttribute('tileheight')) || 32;
                const columns = parseInt(tilesetEl.getAttribute('columns')) || 0;
                const tilecount = parseInt(tilesetEl.getAttribute('tilecount')) || 0;
                return { imageSource: source, tilewidth, tileheight, columns, tilecount };
            } catch (e) {
                console.error('Error loading .tsx:', url, e.message);
                return null;
            }
        }

        async function parseTMX(xmlText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(xmlText, 'application/xml');
            const parseError = doc.querySelector('parsererror');
            if (parseError) throw new Error('XML parse error: ' + parseError.textContent);
            const mapEl = doc.querySelector('map');
            if (!mapEl) throw new Error('No <map> element');

            const map = {
                version: mapEl.getAttribute('version') || '1.0',
                orientation: mapEl.getAttribute('orientation') || 'orthogonal',
                width: parseInt(mapEl.getAttribute('width')) || 0,
                height: parseInt(mapEl.getAttribute('height')) || 0,
                tilewidth: parseInt(mapEl.getAttribute('tilewidth')) || 32,
                tileheight: parseInt(mapEl.getAttribute('tileheight')) || 32,
                tilesets: [],
                layers: [],
            };

            if (map.orientation !== 'orthogonal') console.warn('Only orthogonal maps are fully supported.');

            const tilesetEls = doc.querySelectorAll('tileset');
            for (const tsEl of tilesetEls) {
                const gid = parseInt(tsEl.getAttribute('firstgid')) || 1;
                const sourceAttr = tsEl.getAttribute('source');

                let tilesetDef = {
                    firstgid: gid,
                    source: sourceAttr,
                    name: tsEl.getAttribute('name') || 'tileset',
                    tilewidth: map.tilewidth,
                    tileheight: map.tileheight,
                    columns: 0,
                    tilecount: 0,
                    imageSource: null,
                };

                if (sourceAttr) {
                    const def = await fetchTilesetDefinition(sourceAttr);
                    if (def) {
                        tilesetDef.tilewidth = def.tilewidth;
                        tilesetDef.tileheight = def.tileheight;
                        tilesetDef.columns = def.columns;
                        tilesetDef.tilecount = def.tilecount;
                        tilesetDef.imageSource = def.imageSource;
                    } else {
                        console.warn('Failed to load .tsx:', sourceAttr);
                    }
                } else {
                    const imageEl = tsEl.querySelector('image');
                    if (imageEl) {
                        tilesetDef.imageSource = imageEl.getAttribute('source');
                        tilesetDef.tilewidth = parseInt(tsEl.getAttribute('tilewidth')) || map.tilewidth;
                        tilesetDef.tileheight = parseInt(tsEl.getAttribute('tileheight')) || map.tileheight;
                        tilesetDef.columns = parseInt(tsEl.getAttribute('columns')) || 0;
                        tilesetDef.tilecount = parseInt(tsEl.getAttribute('tilecount')) || 0;
                    }
                }
                map.tilesets.push(tilesetDef);
            }

            const layerEls = doc.querySelectorAll('layer');
            for (const layerEl of layerEls) {
                const name = layerEl.getAttribute('name') || 'layer';
                const width = parseInt(layerEl.getAttribute('width')) || map.width;
                const height = parseInt(layerEl.getAttribute('height')) || map.height;
                const opacity = parseFloat(layerEl.getAttribute('opacity')) || 1;
                const dataEl = layerEl.querySelector('data');
                let encoding = dataEl ? dataEl.getAttribute('encoding') || 'xml' : 'xml';
                let compression = dataEl ? dataEl.getAttribute('compression') : null;
                let tileData = [];
                if (dataEl) {
                    if (encoding === 'csv') {
                        const csv = dataEl.textContent.trim();
                        tileData = csv.split(/\s*,\s*/).map(Number);
                    } else if (encoding === 'base64') {
                        const base64 = dataEl.textContent.trim();
                        try {
                            const binary = atob(base64);
                            const bytes = new Uint8Array(binary.length);
                            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                            let decompressed;
                            if (compression === 'zlib') decompressed = pako.inflate(bytes);
                            else if (compression === 'gzip') decompressed = pako.ungzip(bytes);
                            else decompressed = bytes;
                            const view = new DataView(decompressed.buffer);
                            const len = decompressed.length / 4;
                            for (let i = 0; i < len; i++) tileData.push(view.getInt32(i * 4, true));
                        } catch (e) { console.error('Base64 decode error:', e); tileData = []; }
                    } else {
                        const tileEls = dataEl.querySelectorAll('tile');
                        for (const tEl of tileEls) tileData.push(parseInt(tEl.getAttribute('gid')) || 0);
                    }
                }
                while (tileData.length < width * height) tileData.push(0);
                map.layers.push({ name, width, height, opacity, encoding, compression, data: tileData.slice(0, width * height) });
            }
            if (map.layers.length === 0) {
                map.layers.push({ name: 'default', width: map.width, height: map.height, opacity: 1, data: new Array(map.width * map.height).fill(0) });
            }
            return map;
        }

        function loadTilesetImages(map) {
            return new Promise((resolve) => {
                const images = {};
                const tilesets = map.tilesets.filter(ts => ts.imageSource);
                if (tilesets.length === 0) {
                    console.warn('No tileset images found');
                    resolve(images);
                    return;
                }

                let loaded = 0;
                const total = tilesets.length;

                tilesets.forEach((ts) => {
                    const src = ts.imageSource;
                    console.log(`Loading image for firstgid=${ts.firstgid}: ${src}`);
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        console.log(`Loaded: ${src}`);
                        images[ts.firstgid] = img;
                        loaded++;
                        if (loaded === total) resolve(images);
                    };
                    img.onerror = () => {
                        console.error(`Failed to load: ${src}`);
                        loaded++;
                        if (loaded === total) resolve(images);
                    };
                    img.src = src;
                });
            });
        }

        function buildCache() {
            const map = state.map;
            if (!map || !state.tilesetsLoaded) return;

            const tw = map.tilewidth;
            const th = map.tileheight;
            const w = map.width;
            const h = map.height;
            const data = map.layers[0].data;

            const fullWidth = w * tw;
            const fullHeight = h * th;
            const maxCacheDim = 4096;
            let scale = 1;
            if (fullWidth > maxCacheDim || fullHeight > maxCacheDim) {
                scale = Math.min(maxCacheDim / fullWidth, maxCacheDim / fullHeight);
                if (scale < 0.25) scale = 0.25;
            }
            state.cacheScale = scale;

            const cacheW = Math.round(fullWidth * scale);
            const cacheH = Math.round(fullHeight * scale);

            const cacheCanvas = document.createElement('canvas');
            cacheCanvas.width = cacheW;
            cacheCanvas.height = cacheH;
            const cacheCtx = cacheCanvas.getContext('2d');

            cacheCtx.imageSmoothingEnabled = false;

            console.log(`Building cache ${cacheW}x${cacheH} (scale ${scale})`);

            // Рисуем с расширением на 1 пиксель, чтобы закрыть зазоры
            const pad = 0.5;

            for (let row = 0; row < h; row++) {
                for (let col = 0; col < w; col++) {
                    const idx = row * w + col;
                    const gid = data[idx] || 0;
                    if (gid === 0) continue;

                    let ts = null;
                    let localId = gid;
                    for (const t of map.tilesets) {
                        if (gid >= t.firstgid) {
                            ts = t;
                            localId = gid - t.firstgid;
                        } else break;
                    }
                    if (!ts) continue;
                    const img = state.tilesetImages[ts.firstgid];
                    if (!img) continue;

                    const cols = ts.columns || Math.floor(img.width / ts.tilewidth);
                    const tileIndex = localId;
                    const sx = (tileIndex % cols) * ts.tilewidth;
                    const sy = Math.floor(tileIndex / cols) * ts.tileheight;

                    const dx = col * tw * scale;
                    const dy = row * th * scale;
                    const dw = tw * scale + pad;
                    const dh = th * scale + pad;

                    cacheCtx.drawImage(img, sx, sy, ts.tilewidth, ts.tileheight, dx, dy, dw, dh);
                }
            }

            state.cacheCanvas = cacheCanvas;
            console.log('Cache built');
        }

        function renderMap() {
            const map = state.map;
            if (!map || !state.tilesetsLoaded) {
                const rect = container.getBoundingClientRect();
                canvas.width = rect.width * (window.devicePixelRatio || 1);
                canvas.height = rect.height * (window.devicePixelRatio || 1);
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, rect.width, rect.height);
                return;
            }

            const layer = map.layers[0];
            const data = layer.data;
            const w = map.width;
            const h = map.height;
            const tw = map.tilewidth;
            const th = map.tileheight;

            const zoom = state.zoom;
            const rect = container.getBoundingClientRect();
            const cw = rect.width;
            const ch = rect.height;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = cw * dpr;
            canvas.height = ch * dpr;
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            // Отключаем сглаживание
            ctx.imageSmoothingEnabled = false;

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, cw, ch);

            if (zoom < 1 && state.cacheCanvas) {
                const cache = state.cacheCanvas;
                const scale = state.cacheScale;
                const left = state.offsetX;
                const top = state.offsetY;
                const right = left + cw / zoom;
                const bottom = top + ch / zoom;
                const leftCache = left * scale;
                const topCache = top * scale;
                const widthCache = (right - left) * scale;
                const heightCache = (bottom - top) * scale;
                ctx.drawImage(cache, leftCache, topCache, widthCache, heightCache, 0, 0, cw, ch);
                hoverInfo.classList.remove('visible');
                return;
            }

            const startCol = Math.floor(state.offsetX / (tw * zoom));
            const endCol = Math.ceil((state.offsetX + cw) / (tw * zoom));
            const startRow = Math.floor(state.offsetY / (th * zoom));
            const endRow = Math.ceil((state.offsetY + ch) / (th * zoom));

            const col0 = Math.max(0, startCol);
            const col1 = Math.min(w - 1, endCol);
            const row0 = Math.max(0, startRow);
            const row1 = Math.min(h - 1, endRow);

            // Небольшое перекрытие для закрытия зазоров
            const overlap = 0.5;

            for (let row = row0; row <= row1; row++) {
                for (let col = col0; col <= col1; col++) {
                    const idx = row * w + col;
                    const gid = data[idx] || 0;
                    if (gid === 0) continue;

                    let ts = null;
                    let localId = gid;
                    for (const t of map.tilesets) {
                        if (gid >= t.firstgid) {
                            ts = t;
                            localId = gid - t.firstgid;
                        } else break;
                    }
                    if (!ts) continue;
                    const img = state.tilesetImages[ts.firstgid];
                    if (!img) {
                        const dx = col * tw * zoom - state.offsetX;
                        const dy = row * th * zoom - state.offsetY;
                        ctx.fillStyle = '#ff00ff';
                        ctx.fillRect(dx, dy, tw * zoom + overlap, th * zoom + overlap);
                        continue;
                    }

                    const cols = ts.columns || Math.floor(img.width / ts.tilewidth);
                    const tileIndex = localId;
                    const sx = (tileIndex % cols) * ts.tilewidth;
                    const sy = Math.floor(tileIndex / cols) * ts.tileheight;

                    const dx = col * tw * zoom - state.offsetX;
                    const dy = row * th * zoom - state.offsetY;
                    const dw = tw * zoom + overlap;
                    const dh = th * zoom + overlap;

                    ctx.drawImage(img, sx, sy, ts.tilewidth, ts.tileheight, dx, dy, dw, dh);
                }
            }

            if (state.hoverGid !== null && state.hoverCol >= 0 && state.hoverRow >= 0) {
                const hx = state.hoverCol * tw * zoom - state.offsetX;
                const hy = state.hoverRow * th * zoom - state.offsetY;
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.lineWidth = 2 / dpr;
                ctx.shadowColor = 'rgba(255,215,0,0.15)';
                ctx.shadowBlur = 6;
                ctx.strokeRect(hx, hy, tw * zoom, th * zoom);
                ctx.shadowBlur = 0;
                hoverTileId.textContent = state.hoverGid;
                hoverPosX.textContent = state.hoverCol;
                hoverPosY.textContent = state.hoverRow;
                hoverInfo.classList.add('visible');
            } else {
                hoverInfo.classList.remove('visible');
            }
        }

        function resizeCanvas() { renderMap(); }

        function setupInteraction() {
            let isDragging = false, startX = 0, startY = 0, startOffX = 0, startOffY = 0;
            container.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                startOffX = state.offsetX; startOffY = state.offsetY;
                container.style.cursor = 'grabbing';
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const dx = (e.clientX - startX) / state.zoom;
                    const dy = (e.clientY - startY) / state.zoom;
                    state.offsetX = startOffX - dx;
                    state.offsetY = startOffY - dy;
                    renderMap();
                } else {
                    updateHover(e.clientX, e.clientY);
                }
            });
            window.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false; container.style.cursor = 'grab'; }
            });
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (!state.map) return;
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                const newZoom = Math.min(8, Math.max(0.1, state.zoom + delta * state.zoom));
                if (newZoom === state.zoom) return;
                const rect = container.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const mapX = (mx + state.offsetX) / state.zoom;
                const mapY = (my + state.offsetY) / state.zoom;
                state.zoom = newZoom;
                state.offsetX = mapX * state.zoom - mx;
                state.offsetY = mapY * state.zoom - my;
                renderMap();
            }, { passive: false });
            resetViewBtn.addEventListener('click', () => { state.zoom = 1; state.offsetX = 0; state.offsetY = 0; renderMap(); });
            zoomInBtn.addEventListener('click', () => { state.zoom = Math.min(8, state.zoom * 1.3); renderMap(); });
            zoomOutBtn.addEventListener('click', () => { state.zoom = Math.max(0.1, state.zoom / 1.3); renderMap(); });
        }

        function updateHover(clientX, clientY) {
            if (!state.map || !state.tilesetsLoaded || state.zoom < 1) {
                state.hoverGid = null; state.hoverCol = -1; state.hoverRow = -1;
                hoverInfo.classList.remove('visible');
                return;
            }
            const rect = container.getBoundingClientRect();
            const mx = clientX - rect.left;
            const my = clientY - rect.top;
            const tw = state.map.tilewidth * state.zoom;
            const th = state.map.tileheight * state.zoom;
            const col = Math.floor((mx + state.offsetX) / tw);
            const row = Math.floor((my + state.offsetY) / th);
            if (col >= 0 && col < state.map.width && row >= 0 && row < state.map.height) {
                const idx = row * state.map.width + col;
                const gid = state.map.layers[0].data[idx] || 0;
                state.hoverGid = gid; state.hoverCol = col; state.hoverRow = row;
            } else {
                state.hoverGid = null; state.hoverCol = -1; state.hoverRow = -1;
                hoverInfo.classList.remove('visible');
            }
            renderMap();
        }

        async function loadMapFromURL() {
            try {
                console.log('Auto-loading map.tmx...');
                const response = await fetch('map.tmx');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const xmlText = await response.text();
                const map = await parseTMX(xmlText);
                state.map = map;
                updateInfo();
                const images = await loadTilesetImages(map);
                state.tilesetImages = images;
                state.tilesetsLoaded = true;
                buildCache();
                console.log('Loaded tilesets:', Object.keys(images).length);
                state.zoom = 1; state.offsetX = 0; state.offsetY = 0;
                renderMap();
                return true;
            } catch (err) {
                console.warn('Auto-load failed:', err.message);
                return false;
            }
        }

        async function loadMapFromFile(tmxFile, imageFiles) {
            try {
                const text = await tmxFile.text();
                const map = await parseTMX(text);
                state.map = map;
                updateInfo();
                const images = {};
                const total = map.tilesets.length;
                let loaded = 0;
                for (const ts of map.tilesets) {
                    if (!ts.imageSource) { loaded++; if (loaded === total) finish(); continue; }
                    const filename = ts.imageSource.split(/[\\/]/).pop();
                    let found = false;
                    for (const file of imageFiles) {
                        if (file.name === filename) {
                            const img = new Image();
                            img.onload = () => { images[ts.firstgid] = img; loaded++; if (loaded === total) finish(); };
                            img.onerror = () => { console.warn('Failed:', file.name); loaded++; if (loaded === total) finish(); };
                            img.src = URL.createObjectURL(file);
                            found = true;
                            break;
                        }
                    }
                    if (!found) { console.warn('File not found:', filename); loaded++; if (loaded === total) finish(); }
                }
                if (total === 0) finish();

                function finish() {
                    state.tilesetImages = images;
                    state.tilesetsLoaded = true;
                    buildCache();
                    state.zoom = 1; state.offsetX = 0; state.offsetY = 0;
                    renderMap();
                }
            } catch (err) { console.error(err); }
        }

        tmxFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            state.map = null; state.tilesetImages = {}; state.tilesetsLoaded = false;
            state.hoverGid = null; state.hoverCol = -1; state.hoverRow = -1;
            const imageFiles = imageFileInput.files;
            if (imageFiles.length === 0) {
                alert('Please select tileset images first (Images button).');
                return;
            }
            loadMapFromFile(file, imageFiles);
        });

        imageFileInput.addEventListener('change', () => {
            if (state.map && !state.tilesetsLoaded) {
                const tmxFiles = tmxFileInput.files;
                if (tmxFiles.length > 0) loadMapFromFile(tmxFiles[0], imageFileInput.files);
            }
        });

        async function init() {
            setupInteraction();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === '0') { e.preventDefault(); state.zoom = 1; state.offsetX = 0; state.offsetY = 0; renderMap(); }
            });
            const autoOk = await loadMapFromURL();
            if (!autoOk) {
                manualTmxWrap.style.display = 'inline-block';
                manualImgWrap.style.display = 'inline-block';
                manualSep.style.display = 'inline-block';
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
